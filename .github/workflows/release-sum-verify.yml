name: Release sum-verify

# Called by release-please.yml on every push to main. Publishes the draft
# release that a merged release PR approved; otherwise does nothing.
on:
  workflow_call:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    env:
      MISE_ENABLE_TOOLS: go,python
      # Build only with the mise-pinned Go; never switch to another toolchain.
      # scripts/build-sum-verify-release.sh enforces this independently.
      GOTOOLCHAIN: local
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Requires the tag to be the merge commit of the merged release PR for
      # the manifest version, on main, before anything is built.
      - name: Find the approved release
        id: release
        run: |
          set -euo pipefail
          cp scripts/publish-sum-verify-release.sh "$RUNNER_TEMP/publish-sum-verify-release.sh"
          "$RUNNER_TEMP/publish-sum-verify-release.sh" resolve

      - name: Check out the release commit
        if: ${{ steps.release.outputs.action == 'publish' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Set up pinned Go
        if: ${{ steps.release.outputs.action == 'publish' }}
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.3
          install_args: go python
          cache: false

      - name: Test the tool
        if: ${{ steps.release.outputs.action == 'publish' }}
        run: mise run lint && (cd tools/verify && go test ./...) && (cd tests/portable && python3 ../../scripts/fixture_git_env.py -- go test -count=1 ./...)

      - name: Build binaries and checksums
        if: ${{ steps.release.outputs.action == 'publish' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        # The script refuses any Go other than the committed mise.toml pin and
        # checks every binary's embedded toolchain before writing checksums.
        run: |
          set -euo pipefail
          scripts/build-sum-verify-release.sh "$VERSION" dist | tee "$RUNNER_TEMP/toolchain.txt"

      - name: Publish release
        if: ${{ steps.release.outputs.action == 'publish' }}
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: '"$RUNNER_TEMP/publish-sum-verify-release.sh" publish "$TAG" "$VERSION" dist "$RUNNER_TEMP/toolchain.txt"'
