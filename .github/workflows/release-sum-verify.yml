name: Release sum-verify

on:
  push:
    tags: ["sum-verify-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: go,python
      # Build only with the mise-pinned Go; never switch to another toolchain.
      # scripts/build-sum-verify-release.sh enforces this independently.
      GOTOOLCHAIN: local
    steps:
      - name: Check out tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a tag on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main" >&2; exit 1; }

      - name: Set up pinned Go
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.3
          install_args: go python
          cache: false

      - name: Test the tool
        run: mise run lint && (cd tools/verify && go test ./...) && (cd tests/portable && python3 ../../scripts/fixture_git_env.py -- go test -count=1 ./...)

      - name: Build binaries and checksums
        env:
          TAG: ${{ github.ref_name }}
        # The script refuses any Go other than the committed mise.toml pin and
        # checks every binary's embedded toolchain before writing checksums.
        run: |
          set -euo pipefail
          [[ "$TAG" == sum-verify-v* ]] || { echo "tag $TAG is not sum-verify-vX.Y.Z" >&2; exit 1; }
          scripts/build-sum-verify-release.sh "${TAG#sum-verify-v}" dist | tee "$RUNNER_TEMP/toolchain.txt"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "Pin with: .agents/skills/verify/scripts/sum-verify pin ${TAG#sum-verify-v}"
            echo
            echo "Built with:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/toolchain.txt"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
