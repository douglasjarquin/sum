[tools]
go = "1.27.4"
python = "3.13.5"
node = "22.20.0"
aube = "2.2.4"

[tasks."web:install"]
description = "Install web dependencies from aube-lock.yaml"
run = "aube -C web install"

[tasks."web:deps"]
description = "Install the Playwright Chromium browser for local e2e runs"
run = "aube -C web exec playwright install chromium"

[tasks."web:dev"]
description = "Start the Astro development server"
# ASTRO_DEV_BACKGROUND=1 keeps astro dev foregrounded under agent detection.
run = "ASTRO_DEV_BACKGROUND=1 aube -C web run dev -- --host 127.0.0.1"

[tasks."web:check"]
description = "Run Astro type and template checks"
run = "aube -C web run check"

[tasks."web:build"]
description = "Build the Astro site"
run = "aube -C web run build"

[tasks."web:test"]
description = "Run Astro unit and end-to-end tests (run web:deps once for the browser)"
run = "aube -C web run test"
